  <polyline points="52,80 116,117.5 180,92.5 244,55 308,98.75" fill="none" stroke="#0069a6" stroke-width="1.5" opacity="0.5"/>
  <polyline points="52,111.25 116,61.25 180,80 244,123.75 308,55" fill="none" stroke="#0069a6" stroke-width="1.5" opacity="0.5"/>
  <polyline points="52,55 116,86.25 180,117.5 244,73.75 308,92.5" fill="none" stroke="#e24832" stroke-width="3" opacity="1"/>
  <polyline points="52,95 116,105 180,65 244,86.25 308,115" fill="none" stroke="#0069a6" stroke-width="1.5" opacity="0.5"/>
</svg>
