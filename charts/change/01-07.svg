  <path d="M174,94 C208,70 250,44 338,28 L338,154 C260,135 210,116 174,94 Z" fill="#9ed0ab" stroke="none"/>
  <path d="M174,94 C215,80 270,65 338,52 L338,132 C270,119 215,106 174,94 Z" fill="#8cc7df" stroke="none" opacity="0.65"/>
  <path d="M174,94 C220,91 276,86 338,79 L338,108 C276,103 220,98 174,94 Z" fill="#0069a6" stroke="none" opacity="0.55"/>
