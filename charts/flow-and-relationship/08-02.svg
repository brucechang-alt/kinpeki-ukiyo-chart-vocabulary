<?xml version="1.0" encoding="utf-8"?>
<svg class="chart-svg woodblock-chart" data-style="kinpeki-ukiyo" role="img" aria-labelledby="t-瀑布图示例 d-瀑布图示例" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <style>:root{--paper:#fbf3de;--ink:#181a1b;--muted:#655f53;--rule:#c8b990;--vermilion:#e24832;--aizuri:#0069a6;--rokusho:#3a8a5c;--kuchiba:#e2a228;--fuji:#8d4b8e;--gold:#e0b53a}
*{vector-effect:non-scaling-stroke}
text{font-family:"Source Han Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.label,.value,.value-light,.big-value,.note,.tick,.axis-title{font-size:12px}
.value,.big-value{font-weight:700;font-variant-numeric:tabular-nums}.big-value{font-size:18px}
.value-light{font-weight:700;fill:var(--paper)}.tick,.axis-title{fill:var(--muted)}
.axis{stroke:var(--ink);stroke-width:1}.grid{stroke:var(--rule);stroke-width:.8;stroke-dasharray:2 5;opacity:.7}
.reference,.stem{stroke:var(--ink);stroke-width:1.1}.red{stroke:var(--vermilion);stroke-width:2.5;stroke-dasharray:8 5}.blue{stroke:var(--aizuri);stroke-width:2.5}.green{stroke:var(--rokusho);stroke-width:2.5;stroke-dasharray:2 4}.gold{stroke:var(--kuchiba);stroke-width:2.5;stroke-dasharray:1 4}
[fill="#0069a6"],[fill="#e24832"],[fill="#3a8a5c"],[fill="#e2a228"],[fill="#8d4b8e"],[fill="#8cc7df"],[fill="#f5a08b"],[fill="#9ed0ab"]{stroke:var(--ink);stroke-width:.65;stroke-linejoin:round;paint-order:stroke fill}
[stroke="#e24832"]{stroke-dasharray:8 5}[stroke="#3a8a5c"]{stroke-dasharray:2 4}[stroke="#e2a228"]{stroke-dasharray:1 4}
path,polyline,line{stroke-linecap:round;stroke-linejoin:round}</style><rect class="ukiyo-paper" x="0" y="0" width="360" height="190" fill="#fbf3de"/><rect class="ukiyo-paper" x="0" y="0" width="360" height="190" fill="#fbf3de"/><rect class="ukiyo-paper" x="0" y="0" width="360" height="190" fill="#fbf3de"/>
  <title id="t-瀑布图示例">瀑布图示例</title>
  <desc id="d-瀑布图示例">增减项把起点逐步桥接到终点。</desc>
  <line x1="38" y1="156" x2="340" y2="156" class="axis"/>
  <rect x="45" y="66" width="30" height="90" fill="#47433b"/>
  <text x="60" y="61" class="value" text-anchor="middle">100</text>
  <rect x="96" y="44.39999999999999" width="30" height="21.6" fill="#0069a6"/>
  <text x="111" y="37.39999999999999" class="value" text-anchor="middle">+24</text>
  <line x1="75" y1="66" x2="96" y2="66" class="connector"/>
  <rect x="147" y="44.39999999999999" width="30" height="13.5" fill="#f5a08b"/>
  <text x="162" y="37.39999999999999" class="value" text-anchor="middle">-15</text>
  <line x1="126" y1="44.39999999999999" x2="147" y2="44.39999999999999" class="connector"/>
  <rect x="198" y="41.7" width="30" height="16.2" fill="#0069a6"/>
  <text x="213" y="34.7" class="value" text-anchor="middle">+18</text>
  <line x1="177" y1="57.89999999999999" x2="198" y2="57.89999999999999" class="connector"/>
  <rect x="249" y="41.7" width="30" height="8.1" fill="#f5a08b"/>
  <text x="264" y="34.7" class="value" text-anchor="middle">-9</text>
  <line x1="228" y1="41.7" x2="249" y2="41.7" class="connector"/>
  <rect x="300" y="49.8" width="30" height="106.2" fill="#47433b"/>
  <text x="315" y="44.8" class="value" text-anchor="middle">118</text>
  <text x="60" y="180" class="axis-title" text-anchor="middle">起点</text>
  <text x="315" y="180" class="axis-title" text-anchor="middle">终点</text>
</svg>
