<?xml version="1.0" encoding="utf-8"?>
<svg class="chart-svg woodblock-chart" data-style="kinpeki-ukiyo" role="img" aria-labelledby="t-连接散点图示例 d-连接散点图示例" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <style>:root{--paper:#fbf3de;--ink:#181a1b;--muted:#655f53;--rule:#c8b990;--vermilion:#e24832;--aizuri:#0069a6;--rokusho:#3a8a5c;--kuchiba:#e2a228;--fuji:#8d4b8e;--gold:#e0b53a}
*{vector-effect:non-scaling-stroke}
text{font-family:"Source Han Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.label,.value,.value-light,.big-value,.note,.tick,.axis-title{font-size:12px}
.value,.big-value{font-weight:700;font-variant-numeric:tabular-nums}.big-value{font-size:18px}
.value-light{font-weight:700;fill:var(--paper)}.tick,.axis-title{fill:var(--muted)}
.axis{stroke:var(--ink);stroke-width:1}.grid{stroke:var(--rule);stroke-width:.8;stroke-dasharray:2 5;opacity:.7}
.reference,.stem{stroke:var(--ink);stroke-width:1.1}.red{stroke:var(--vermilion);stroke-width:2.5;stroke-dasharray:8 5}.blue{stroke:var(--aizuri);stroke-width:2.5}.green{stroke:var(--rokusho);stroke-width:2.5;stroke-dasharray:2 4}.gold{stroke:var(--kuchiba);stroke-width:2.5;stroke-dasharray:1 4}
[fill="#0069a6"],[fill="#e24832"],[fill="#3a8a5c"],[fill="#e2a228"],[fill="#8d4b8e"],[fill="#8cc7df"],[fill="#f5a08b"],[fill="#9ed0ab"]{stroke:var(--ink);stroke-width:.65;stroke-linejoin:round;paint-order:stroke fill}
[stroke="#e24832"]{stroke-dasharray:8 5}[stroke="#3a8a5c"]{stroke-dasharray:2 4}[stroke="#e2a228"]{stroke-dasharray:1 4}
path,polyline,line{stroke-linecap:round;stroke-linejoin:round}</style><rect class="ukiyo-paper" x="0" y="0" width="360" height="190" fill="#fbf3de"/><rect class="ukiyo-paper" x="0" y="0" width="360" height="190" fill="#fbf3de"/><rect class="ukiyo-paper" x="0" y="0" width="360" height="190" fill="#fbf3de"/>
  <title id="t-连接散点图示例">连接散点图示例</title>
  <desc id="d-连接散点图示例">二维位置按时间顺序连接，起点和终点直接标出。</desc>
  <line x1="38" y1="158" x2="340" y2="158" class="axis"/>
  <line x1="38" y1="20" x2="38" y2="158" class="axis"/>
  <text x="189" y="184" class="axis-title" text-anchor="middle" data-axis="x">变量X</text>
  <text x="12" y="90" class="axis-title" text-anchor="middle" transform="rotate(-90 12 90)" data-axis="y">变量Y</text>
  <polyline points="58,136 80,127 106,131 132,113 164,105 192,91 222,82 253,61 289,48 322,34" fill="none" stroke="#0069a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="58" cy="136" r="5" fill="#fbf3de" stroke="#0069a6" stroke-width="2"/>
  <circle cx="80" cy="127" r="3" fill="#fbf3de" stroke="#0069a6" stroke-width="2"/>
  <circle cx="106" cy="131" r="3" fill="#fbf3de" stroke="#0069a6" stroke-width="2"/>
  <circle cx="132" cy="113" r="3" fill="#fbf3de" stroke="#0069a6" stroke-width="2"/>
  <circle cx="164" cy="105" r="3" fill="#fbf3de" stroke="#0069a6" stroke-width="2"/>
  <circle cx="192" cy="91" r="3" fill="#fbf3de" stroke="#0069a6" stroke-width="2"/>
  <circle cx="222" cy="82" r="3" fill="#fbf3de" stroke="#0069a6" stroke-width="2"/>
  <circle cx="253" cy="61" r="3" fill="#fbf3de" stroke="#0069a6" stroke-width="2"/>
  <circle cx="289" cy="48" r="3" fill="#fbf3de" stroke="#0069a6" stroke-width="2"/>
  <circle cx="322" cy="34" r="5" fill="#e24832" stroke="#e24832" stroke-width="2"/>
  <text x="52" y="151" class="note" text-anchor="start">起点</text>
  <text x="326" y="31" class="note" text-anchor="end">终点</text>
  <defs>
    <marker id="arrow" markerwidth="8" markerheight="8" refx="6" refy="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#0069a6" stroke="none"/>
    </marker>
  </defs>
</svg>
